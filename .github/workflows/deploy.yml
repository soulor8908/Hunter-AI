name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Ensure Cloudflare resources exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          echo "::group::Create KV namespace (if not exists)"
          KV_OUTPUT=$(npx wrangler kv:namespace create TRIAL_KV 2>&1 || true)
          echo "$KV_OUTPUT"
          KV_ID=$(echo "$KV_OUTPUT" | grep -oP 'id\s*=\s*"\K[^"]+' | head -1)
          if [ -n "$KV_ID" ]; then
            echo "New KV namespace created with id: $KV_ID"
            sed -i "s/id = \".*\"/id = \"$KV_ID\"/" wrangler.toml
            echo "Updated wrangler.toml with new KV id"
          else
            echo "KV namespace may already exist, using id from wrangler.toml"
          fi
          echo "::endgroup::"

          # Vectorize 索引为可选功能，需 API Token 有 Vectorize: Edit 权限
          # 启用方法：取消 wrangler.toml 中 [[vectorize]] 的注释，然后推送
          if grep -q '^\[\[vectorize\]\]' wrangler.toml; then
            echo "::group::Create Vectorize index (if not exists)"
            npx wrangler vectorize create hunter-ai-jd --dimensions 1536 --metric cosine 2>&1 || echo "Index may already exist or insufficient permissions, continuing..."
            echo "::endgroup::"
          fi

      - name: Deploy to Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
        env:
          AI_GATEWAY_PROVIDER: ${{ secrets.AI_GATEWAY_PROVIDER }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          AI_GATEWAY_MODEL: ${{ secrets.AI_GATEWAY_MODEL }}
          TRIAL_DAILY_QUOTA_PER_IP: ${{ secrets.TRIAL_DAILY_QUOTA_PER_IP }}
          EMBEDDING_PROVIDER: ${{ secrets.EMBEDDING_PROVIDER }}
          EMBEDDING_BASE_URL: ${{ secrets.EMBEDDING_BASE_URL }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
          EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}

      - name: Summary
        if: always()
        run: |
          echo "## Deploy Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ 已成功部署到 Cloudflare Workers" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "访问地址：https://hunter-ai-worker.workers.dev" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ 部署失败，请检查日志和 Secrets 配置" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "常见问题：" >> $GITHUB_STEP_SUMMARY
            echo "- 确认已配置 CLOUDFLARE_API_TOKEN 和 CLOUDFLARE_ACCOUNT_ID" >> $GITHUB_STEP_SUMMARY
            echo "- 确认 API Token 有 Edit Workers 权限" >> $GITHUB_STEP_SUMMARY
          fi
