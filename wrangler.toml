# Hunter AI — Cloudflare 部署配置
# 模式：Worker + Static Assets 单域部署
# - /api/* 由 Worker 处理（Trial AI 代理 + 共享 JD 池）
# - 其它路径由 Static Assets 托管（SPA 由 not_found_handling 处理）
# - 前后端同域，无 CORS 问题，一条命令部署

name = "hunter-ai-worker"
main = "worker/index.ts"
compatibility_date = "2024-09-23"

# 静态资源（前端 SPA）
# 构建产物在 dist/，由 Worker 通过 ASSETS binding 托管
# not_found_handling = "single-page-application" 让所有非 /api 路径回退到 index.html，支持前端路由
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Trial 模式环境变量（在 Dashboard → Settings → Variables 中配置 secret）
# AI_GATEWAY_PROVIDER = "deepseek"   # chat 用；embedding 建议配成 openai 兼容
# AI_GATEWAY_API_KEY = "sk-..."
# AI_GATEWAY_MODEL = "deepseek-chat"
# TRIAL_DAILY_QUOTA_PER_IP = "20"
# Embedding 配置（共享池 + Trial 用户 embedding 代理用）
# EMBEDDING_PROVIDER = "openai"
# EMBEDDING_BASE_URL = "https://api.openai.com/v1"
# EMBEDDING_API_KEY = "sk-..."      # 与 AI_GATEWAY_API_KEY 可不同
# EMBEDDING_MODEL = "text-embedding-3-small"

# KV 命名空间（部署时自动创建，无需手动配置）
[[kv_namespaces]]
binding = "TRIAL_KV"
id = "ab9c576d248a424c895081538270e10b"

# Vectorize 索引（共享 JD 池，可选功能）
# 启用步骤：
# 1. 确保 API Token 有 Vectorize: Edit 权限
# 2. 取消下方注释
# 3. 推送代码，部署时会自动创建索引
# [[vectorize]]
# binding = "JD_INDEX"
# index_name = "hunter-ai-jd"

# CORS / 路由
[vars]
CORS_ALLOW_ORIGIN = "*"
